apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collector-shop-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/alan-crts/collector-shop.git'
    path: infra/k8s
    targetRevision: main
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: collector-shop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
