apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: collector-shop-prod
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: collector-shop-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # TODO: REMPLACER PAR VOTRE IMAGE GITHUB
          image: ghcr.io/VOTRE_COMPTE_GITHUB/collector-shop-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: backend-secret
